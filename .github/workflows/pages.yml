name: Deploy to GitHub Pages

# The site is served from the gh-pages branch (Pages auto-enables for it).
# This workflow mirrors main into gh-pages on every push, so the live app
# always matches main — no manual Pages setup required.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Mirror main to gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git push --force origin HEAD:gh-pages
